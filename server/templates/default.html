<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f7;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
        }

        .body {
            padding: 30px;
            color: #333333;
            line-height: 1.6;
            font-size: 16px;
        }

        .footer {
            padding: 20px 30px;
            text-align: center;
            color: #999999;
            font-size: 12px;
            border-top: 1px solid #eeeeee;
        }

        .footer a {
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div style="padding: 20px;">
        <div class="container">
            <div class="header">
                <h1>{{subject}}</h1>
            </div>
            <div class="body">
                <p>Hi {{name}},</p>
                {{body}}
            </div>
            <div class="footer">
                <p>Sent via Automail</p>
            </div>
        </div>
    </div>
</body>

</html>
